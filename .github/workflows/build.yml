name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q app.zip -d src
      - name: Chiave di firma
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Manca il secret KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > src/app/release.jks
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        working-directory: src
        run: gradle assembleRelease -Pvc=${{ github.run_number }} -PghRepo=${{ github.repository }} --no-daemon
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp src/app/build/outputs/apk/release/app-release.apk Acqua.apk
          gh release create v1.0.${{ github.run_number }} Acqua.apk --title "v1.0.${{ github.run_number }}" --notes "Build automatica"
